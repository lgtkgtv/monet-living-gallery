name: 🔄 Monet Living Gallery - Pipeline & Sync

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Pipeline task to execute'
        required: true
        type: choice
        default: 'sync_if_modified'
        options:
          - 'sync_if_modified'
          - 'check_updates'
          - 'refresh'
          - 'extract_wallpapers'
          - 'full_sync'
          - 'sync_resolutions'
          - 'rebuild_only'
      batch_size:
        description: 'Wallpaper batch extraction count (if action extracts wallpapers)'
        required: false
        type: string
        default: '10'
      tier:
        description: 'Wallpaper quality tier to prioritize'
        required: false
        type: choice
        default: 'fhd'
        options:
          - 'fhd'
          - '4k'
          - 'all'
  schedule:
    # Weekly check: Sunday at 04:00 UTC (checks if source playlist modified before pulling)
    - cron: '0 4 * * 0'

permissions:
  contents: write

concurrency:
  group: gallery-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Run Gallery Orchestrator
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚡ Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 🐍 Set up Python
        run: uv python install 3.12

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install FFmpeg & System Utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 📦 Install Python & Node Dependencies
        run: |
          uv sync
          npm install jsdom

      - name: 🚀 Execute Pipeline Action
        run: |
          ACTION="${{ inputs.action || 'sync_if_modified' }}"
          BATCH_SIZE="${{ inputs.batch_size || '10' }}"
          TIER="${{ inputs.tier || 'fhd' }}"

          echo "======================================================"
          echo "🎨 Executing Action: $ACTION"
          echo "   Batch Size:      $BATCH_SIZE"
          echo "   Quality Tier:    $TIER"
          echo "======================================================"

          if [ "$ACTION" = "sync_if_modified" ]; then
            uv run python3 pipeline.py --sync-if-modified
          elif [ "$ACTION" = "check_updates" ]; then
            uv run python3 pipeline.py --check-updates
          elif [ "$ACTION" = "refresh" ]; then
            uv run python3 pipeline.py --refresh
          elif [ "$ACTION" = "extract_wallpapers" ]; then
            uv run python3 pipeline.py --extract --tier "$TIER" --batch-size "$BATCH_SIZE" --delay 2.5
            uv run python3 pipeline.py --build
          elif [ "$ACTION" = "full_sync" ]; then
            uv run python3 pipeline.py --sync
          elif [ "$ACTION" = "sync_resolutions" ]; then
            uv run python3 pipeline.py --sync-resolutions
          elif [ "$ACTION" = "rebuild_only" ]; then
            uv run python3 pipeline.py --build
          else
            echo "Unknown action: $ACTION. Defaulting to status & build."
            uv run python3 pipeline.py --build
          fi

      - name: 🧪 Run Automated Verification Tests
        run: |
          node tests/test_gallery.js

      - name: 📤 Commit & Push Updated Gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "✅ No updates detected. Working tree is clean."
          else
            ACTION_LABEL="${{ inputs.action || 'scheduled-refresh' }}"
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(sync): automated gallery pipeline ($ACTION_LABEL) - $TIMESTAMP [skip ci]"
            git push origin main
            echo "🚀 Successfully pushed updates to origin/main."
          fi
